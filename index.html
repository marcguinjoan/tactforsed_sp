<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Simulador · Encuesta de Teorías políticas (TaCT-FoRSED · España)</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b1d21; --muted:#6b7280; --line:#e2e5ea;
  --accent:#1f4e79; --accent-soft:#e8f0f8; --warn:#8a5a00; --warn-soft:#fff6e0;
  --ok:#1d6f42; --ok-soft:#e7f4ec; --danger:#9b2226;
  --radius:10px; --maxw:820px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:0 0 60px;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:16px}
header.top{
  background:var(--accent); color:#fff; padding:10px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
header.top .ttl{font-weight:600;font-size:15px}
header.top .meta{font-size:13px;opacity:.85}
.progress{height:4px;background:#d7dce3}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; margin:16px 0; box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.blocktag{
  display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin-bottom:12px;
}
h1{font-size:22px;margin:0 0 12px;line-height:1.3}
h2{font-size:18px;margin:22px 0 8px;line-height:1.35}
h3{font-size:16px;margin:18px 0 6px}
.qtitle{font-size:18px;font-weight:600;margin:0 0 6px;line-height:1.4}
.qnote{color:var(--muted);font-size:14px;margin:0 0 16px}
p{margin:0 0 12px}
.stim{background:var(--accent-soft);border-left:4px solid var(--accent);padding:16px 18px;border-radius:6px;margin:0 0 18px}
.stim h3{margin-top:0}
.doc{font-size:15px}
.doc h3{font-size:15px;font-weight:700;margin:16px 0 4px}
.doc a{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.opt{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  background:#fff; border:1px solid var(--line); border-radius:8px; padding:11px 14px;
  font:inherit; color:inherit; cursor:pointer; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:#b9c3cf;background:#fbfcfd}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt .bullet{
  flex:0 0 18px;height:18px;margin-top:2px;border:1px solid #a9b3bf;border-radius:50%;background:#fff;
}
.opt.multi .bullet{border-radius:4px}
.opt.sel .bullet{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.opt.multi.sel .bullet{box-shadow:inset 0 0 0 2px #fff}
.subq{margin:0 0 22px}
.subq .qtitle{font-size:16px}
.slider-wrap{margin:8px 0 4px}
.slider-val{
  text-align:center;font-size:30px;font-weight:700;color:var(--accent);margin:6px 0 2px;line-height:1
}
.slider-val.empty{color:#b6bcc5}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=range].untouched{accent-color:#c2c8d0}
.poles{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin-top:2px}
.poles span{max-width:45%}
.poles span:last-child{text-align:right}
.gridwrap{overflow-x:auto;margin:0 0 8px;border:1px solid var(--line);border-radius:8px}
table.grid{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
table.grid th{background:#f7f8fa;font-weight:600;font-size:12px;color:#40474f;position:sticky;top:0}
table.grid th.itemcol,table.grid td.itemcol{text-align:left;min-width:230px;font-weight:400}
table.grid tr:last-child td{border-bottom:none}
table.grid td.cell{cursor:pointer}
table.grid td.cell:hover{background:#f2f6fa}
.dot{display:inline-block;width:18px;height:18px;border:1px solid #a9b3bf;border-radius:50%;background:#fff;vertical-align:middle}
td.cell.sel .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.polelegend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:0 0 6px}
.field{margin:0 0 14px}
.field label{display:block;font-size:14px;margin-bottom:4px;color:#3a4149}
select,input[type=text],input[type=number],textarea{
  font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;width:100%;max-width:420px;
}
textarea{max-width:100%;min-height:80px;resize:vertical}
.err{color:var(--danger);font-size:14px;margin:6px 0 0}
.btn-row{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
button.nav{
  font:inherit;font-weight:600;padding:11px 22px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;
}
button.nav:hover{background:#1a4267}
button.ghost{background:#fff;color:var(--accent)}
button.ghost:hover{background:var(--accent-soft)}
button.small{padding:6px 12px;font-size:13px;font-weight:500}
details.cbox{margin-top:20px;border:1px dashed var(--line);border-radius:8px;padding:10px 14px;background:#fbfbfc}
details.cbox summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:600}
details.cbox[data-filled="1"] summary{color:var(--ok)}
details.cbox .colname{font-size:12px;color:var(--muted);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.footlink{text-align:center;margin:18px 0 0}
.footlink a{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px dotted var(--muted)}
.footlink a:hover{color:var(--accent)}
/* --- portada --- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.hero h1{font-size:24px}
.lead{color:var(--muted);margin:0 0 18px}
.assignbox{background:var(--warn-soft);border:1px solid #f0dfae;border-radius:8px;padding:14px 16px;margin:0 0 18px}
.assignbox h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.assignbox ul{margin:0;padding-left:18px;font-size:14px}
.assignbox code{background:#fff;border:1px solid #ecdcae;border-radius:4px;padding:1px 5px;font-size:13px}
.tree{font-size:14px;margin:0 0 6px}
.tree .node{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.tree .node:last-child{border-bottom:none}
.tree .rail{color:#b6bcc5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.tree a.jump{color:var(--accent);text-decoration:none;font-weight:600}
.tree a.jump:hover{text-decoration:underline}
.tree .cond{color:var(--warn);font-size:13px}
.tree .n{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.tree .exp{background:var(--warn-soft)}
.hint{font-size:13px;color:var(--muted)}
.reviewlist{font-size:14px}
.reviewlist .r{border-bottom:1px solid var(--line);padding:8px 0}
.reviewlist .r:last-child{border-bottom:none}
.reviewlist .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.ok{background:var(--ok-soft);border:1px solid #bfe0cc;border-radius:8px;padding:14px 16px}
.warnbox{background:var(--warn-soft);border:1px solid #f0dfae;border-radius:8px;padding:14px 16px}
@media(max-width:640px){
  .card,.hero{padding:16px}
  h1{font-size:20px}.qtitle{font-size:17px}
  table.grid th.itemcol,table.grid td.itemcol{min-width:170px}
}
</style>

/* grupo menos preferido a partir de sympathy (empate -> uno al azar, memorizado) */
function leastPreferred(answers){
  var a = answers.sympathy || {};
  var best = null, tied = [];
  ITEMS.sympathy.forEach(function(it){
    var v = a[it.key];
    if(v == null) return;
    if(best === null || v < best){ best = v; tied = [it]; }
    else if(v === best){ tied.push(it); }
  });
  if(!tied.length) tied = ITEMS.sympathy.slice();
  var sig = tied.map(function(i){ return i.key; }).join(',');
  if(!S.derived.gmp || S.derived.gmpSig !== sig){
    S.derived.gmpSig = sig;
    S.derived.gmp = pick(tied).key;
  }
  var chosen = ITEMS.sympathy.filter(function(i){ return i.key === S.derived.gmp; })[0];
  return chosen || ITEMS.sympathy[0];
}

function ageFrom(y, m){
  if(!y) return null;
  var now = new Date(), age = now.getFullYear() - y;
  if(m && (now.getMonth()+1) < m) age--;
  return age;
}
function quotAgeRange(age){
  if(age == null) return '';
  if(age < 18) return 'screen_out';
  if(age <= 24) return '18_24';
  if(age <= 34) return '25_34';
  if(age <= 44) return '35_44';
  if(age <= 54) return '45_54';
  if(age <= 65) return '55_65';
  return 'more_65';
}

/* ---------- nombres de columna ---------- */
function sanitize(k){
  return String(k||'').replace(/[^A-Za-z0-9_]/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,'');
}
function varKeyOf(q){
  if(q.items) return sanitize(q.code || 'x');
  var k = (q.varTag || '').replace(/[\[\]]/g,'').trim();
  if(k.indexOf('/') >= 0) k = '';
  k = k.replace(/\*/g,'').replace(/_+/g,'_').replace(/^_+|_+$/g,'');
  if(!/^[A-Za-z0-9_]+$/.test(k)) k = '';
  if(!k) k = q.code || 'x';
  return sanitize(k);
}
function assignVarKeys(F){
  var seen = {};
  F.forEach(function(q){
    var k = varKeyOf(q);
    if(seen[k]) k = sanitize(k + '_' + q.code);
    seen[k] = true;
    q.varKey = k;
  });
}

/* ==========================================================================
   4. MOTOR
   ========================================================================== */

var FLOW = [];
var idx = null;                       /* null = portada */
var app = document.getElementById('app');

function recordTiming(i, q, elapsed){
  if(!S.timings[i]) S.timings[i] = {code:q.code, block:q.block, seconds:0};
  S.timings[i].seconds += elapsed;
}
function resumeClock(){ S.qStartTs = Date.now(); }

function setProgress(){
  var bar = document.getElementById('pbar');
  var pct = (idx == null) ? 0 : Math.min(100, Math.round((idx / FLOW.length) * 100));
  bar.style.width = pct + '%';
  var meta = document.getElementById('topmeta');
  if(idx == null) meta.textContent = 'TaCT-FoRSED · UAB · España';
  else if(idx >= FLOW.length) meta.textContent = 'Fin';
  else meta.textContent = 'Pantalla ' + (idx+1) + ' de ' + FLOW.length;
}

function visibleAt(i){
  var q = FLOW[i];
  return !(q.skipIf && q.skipIf(S.answers));
}

function goTo(i, fromPanel){
  if(idx != null && idx < FLOW.length && S.qStartTs)
    recordTiming(idx, FLOW[idx], (Date.now()-S.qStartTs)/1000);
  idx = i;
  if(fromPanel) S.panel.jumps++;
  if(!S.startTs) S.startTs = Date.now();
  resumeClock();
  renderCurrent();
}

function goBack(){
  if(idx == null) return;
  if(idx < FLOW.length && S.qStartTs)
    recordTiming(idx, FLOW[idx], (Date.now()-S.qStartTs)/1000);
  var j = Math.min(idx, FLOW.length) - 1;
  while(j > 0 && !visibleAt(j)) j--;
  if(j < 0){ idx = null; renderHome(); return; }
  idx = j;
  S.terminated = null;
  resumeClock();
  renderCurrent();
}

function advance(here){
  var j = here + 1;
  while(j < FLOW.length && !visibleAt(j)) j++;
  idx = j;
  resumeClock();
  renderCurrent();
}

function renderCurrent(){
  window.scrollTo(0,0);
  setProgress();
  if(idx == null){ renderHome(); return; }
  if(idx >= FLOW.length || S.terminated){ renderEnd(); return; }
  var q = FLOW[idx];
  var here = idx;

  var onNext = function(result){
    recordTiming(here, q, (Date.now()-S.qStartTs)/1000);
    if(q.code) S.answers[q.code] = result;
    if(q.terminate && q.terminate(S.answers)){
      S.terminated = (q.code === 'Consent') ? 'consent' : 'age';
      idx = FLOW.length;
      renderCurrent();
      return;
    }
    S.terminated = null;
    advance(here);
  };

  var node = RENDER[q.type](q, onNext, S.answers[q.code]);

  /* caja de comentarios, añadida desde el motor */
  var navr = node.querySelector('.btn-row');
  if(navr) node.insertBefore(commentBox(q), navr); else node.appendChild(commentBox(q));

  app.innerHTML = '';
  app.appendChild(node);

  var f = el('div','footlink','<a href="#" id="panellink">Panel del simulador</a>');
  f.querySelector('a').onclick = function(e){
    e.preventDefault();
    S.panel.reopened++;
    if(S.qStartTs) recordTiming(here, q, (Date.now()-S.qStartTs)/1000);
    idx = null; renderCurrent();
  };
  app.appendChild(f);
}

/* ---------- caja de comentarios ---------- */
function commentBox(q){
  var key = q.varKey + '_comment';
  var d = el('details','cbox');
  var sum = el('summary', null, comSummary(q));
  d.appendChild(sum);
  var ta = el('textarea');
  ta.placeholder = 'Escribe aquí cualquier comentario sobre esta pantalla: redacción, opciones que faltan, dudas...';
  ta.value = S.comments[q.code] || '';
  ta.oninput = function(){
    S.comments[q.code] = ta.value;
    d.setAttribute('data-filled', ta.value.trim() ? '1' : '0');
    sum.innerHTML = comSummary(q);
  };
  d.setAttribute('data-filled', (S.comments[q.code]||'').trim() ? '1' : '0');
  d.appendChild(ta);
  d.appendChild(el('div','colname','Columna: ' + key));
  if((S.comments[q.code]||'').trim()) d.open = true;
  return d;
}
function comSummary(q){
  return (S.comments[q.code]||'').trim()
    ? '✓ Comentario escrito (haz clic para editarlo)'
    : '¿Algún comentario sobre esta pantalla?';
}

/* ---------- barra de navegación ---------- */
function navRow(onNext, getVal, validate){
  var row = el('div','btn-row');
  var back = el('button','nav ghost','← Atrás');
  back.type = 'button';
  back.onclick = goBack;
  var next = el('button','nav','Continuar →');
  next.type = 'button';
  var err = el('div','err');
  err.style.display = 'none';
  next.onclick = function(){
    if(validate){
      var msg = validate();
      if(msg){ err.textContent = msg; err.style.display = 'block'; return; }
    }
    err.style.display = 'none';
    onNext(getVal());
  };
  row.appendChild(back);
  row.appendChild(next);
  return {row:row, err:err};
}
/* La fila de navegación se añade directamente a la tarjeta: el motor inserta la
   caja de comentarios justo antes de `.btn-row`, y para eso su padre debe ser la
   tarjeta y no un contenedor intermedio. */
function addNav(card, nav){ card.appendChild(nav.row); card.appendChild(nav.err); }

function shell(q, titleHtml, noteHtml){
  var c = el('div','card');
  if(q.block) c.appendChild(el('div','blocktag', q.block));
  if(titleHtml) c.appendChild(el('div','qtitle', titleHtml));
  if(noteHtml) c.appendChild(el('div','qnote', noteHtml));
  return c;
}

/* ==========================================================================
   5. RENDERIZADORES
   ========================================================================== */
var RENDER = {};

RENDER.single = function(q, onNext, prev){
  var c = shell(q, mdToHtml(q.title), q.note);
  if(q.stimHtml) c.appendChild(el('div','stim', q.stimHtml));
  if(q.listLines){
    var ul = el('div','stim');
    ul.innerHTML = '<ul>' + q.listLines.map(function(l){ return '<li>'+l+'</li>'; }).join('') + '</ul>';
    c.appendChild(ul);
  }
  if(q.question) c.appendChild(el('div','qtitle', q.question));
  var dyn = q.dynOptions ? q.dynOptions(S.answers) : null;
  var options = dyn || q.options;
  if(q.dynNote){
    var dn = q.dynNote(S.answers);
    if(dn) c.appendChild(el('div','qnote', dn));
  }
  var sel = (prev == null) ? null : prev;
  var box = el('div','opts');
  options.forEach(function(o){
    var b = el('button','opt' + (sel === o.code ? ' sel' : ''));
    b.type = 'button';
    b.innerHTML = '<span class="bullet"></span><span>' + o.label + '</span>';
    b.onclick = function(){
      sel = o.code;
      Array.prototype.forEach.call(box.children, function(ch){ ch.className = 'opt'; });
      b.className = 'opt sel';
    };
    box.appendChild(b);
  });
  c.appendChild(box);
  var nav = navRow(onNext, function(){ return sel; });
  addNav(c, nav);
  return c;
};

RENDER.dropdown = function(q, onNext, prev){
  var c = shell(q, mdToHtml(q.title), q.note);
  var f = el('div','field');
  if(q.selectLabel) f.appendChild(el('label', null, q.selectLabel));
  var s = el('select');
  s.appendChild(new Option('— Selecciona —',''));

RENDER.scale = function(q, onNext, prev){
  var c = shell(q, mdToHtml(q.title), q.note);

  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = String(q.min); inp.max = String(q.max); inp.step = '1';
  var selected = (prev == null) ? null : prev;
  function paint(){
    if(selected == null){
      val.textContent = '—'; val.className = 'slider-val empty';
      inp.className = 'untouched';
      inp.value = String(Math.round((q.min+q.max)/2));
    } else {
      val.textContent = String(selected); val.className = 'slider-val';
      inp.className = '';
      inp.value = String(selected);
    }
  }
  inp.oninput = function(){ selected = parseInt(inp.value,10); paint(); };
  inp.onkeydown = function(e){
    if(selected == null && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
       e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Home' || e.key === 'End')){
      selected = parseInt(inp.value,10); paint();
    }
  };
  paint();
  w.appendChild(val);
  w.appendChild(inp);
  var poles = el('div','poles');
  poles.appendChild(el('span', null, (q.poles && q.poles[0]) || String(q.min)));

RENDER.multi = function(q, onNext, prev){
  var c = shell(q, mdToHtml(q.title), q.note);
  var vals = {};
  q.items.forEach(function(it){ vals[it.key] = (prev && prev[it.key] != null) ? prev[it.key] : (it.text ? '' : 0); });

  var displayItems = q.items;
  if(q.randomized && S.orders[q.code]){
    var byKey = {};
    q.items.forEach(function(it){ byKey[it.key] = it; });
    displayItems = S.orders[q.code].map(function(k){ return byKey[k]; }).filter(Boolean);
  }
  var box = el('div','opts');
  var textInputs = {};
  displayItems.forEach(function(it){
    var on = it.text ? !!(vals[it.key] && String(vals[it.key]).length) : vals[it.key] === 1;
    var b = el('button','opt multi' + (on ? ' sel' : ''));
    b.type = 'button';
    b.innerHTML = '<span class="bullet"></span><span>' + it.label + '</span>';
    var ti = null;
    if(it.text){
      ti = document.createElement('input');
      ti.type = 'text';
      ti.placeholder = 'Especifica...';
      ti.style.marginTop = '6px';
      ti.value = (typeof vals[it.key] === 'string') ? vals[it.key] : '';
      ti.oninput = function(){
        vals[it.key] = ti.value;
        b.className = 'opt multi' + (ti.value.trim() ? ' sel' : '');
      };
      textInputs[it.key] = ti;
    }
    b.onclick = function(){
      if(it.text){ if(ti) ti.focus(); return; }
      var now = vals[it.key] === 1 ? 0 : 1;
      vals[it.key] = now;
      if(now && it.exclusive){
        q.items.forEach(function(o){ if(o.key !== it.key) vals[o.key] = o.text ? '' : 0; });
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){ x.className = 'opt multi'; });
        Object.keys(textInputs).forEach(function(k){ textInputs[k].value = ''; });
      } else if(now){
        var ex = q.items.filter(function(o){ return o.exclusive; })[0];
        if(ex && vals[ex.key] === 1){
          vals[ex.key] = 0;
          var exBtn = box.querySelector('[data-k="' + ex.key + '"]');
          if(exBtn) exBtn.className = 'opt multi';
        }
      }
      b.className = 'opt multi' + (vals[it.key] === 1 ? ' sel' : '');
    };
    b.setAttribute('data-k', it.key);
    box.appendChild(b);
    if(ti){
      var holder = el('div');
      holder.style.margin = '-2px 0 4px 28px';
      holder.appendChild(ti);
      box.appendChild(holder);
    }
  });
  c.appendChild(box);
  var nav = navRow(onNext, function(){ return vals; });
  addNav(c, nav);
  return c;
};

function condLabel(){
  var A = S.assign;
  var out = [];
  out.push(['Orden de bloques', A.block_order === 'tradeoffs_first' ? 'Trade-offs → Conspiracy beliefs' : 'Conspiracy beliefs → Trade-offs']);
  if(A.spain_split_exp1 === 'list'){
    out.push(['Experimento 1', 'Experimento de lista · Rama ' + A.rama + ' (' + (A.rama === 'A' ? 'chemtrails' : 'COVID-19') + ') · list_arm ' + A.list_arm]);
  } else {
    out.push(['Experimento 1', 'Batería items_spain (31 ítems, sin experimento de lista)']);
  }
  out.push(['Experimento 2', TRAITS[A.condition_traits].name + ' (' + A.condition_traits + '/9)']);
  if(A.exp3_block === 'debunk')
    out.push(['Experimento 3', 'DEBUNK · ' + DEBUNK[A.condition_debunk].name + ' (' + A.condition_debunk + '/4)']);
  else
    out.push(['Experimento 3', 'PREBUNK · ' + PREBUNK[A.condition_prebunk].name + ' (' + A.condition_prebunk + '/4)']);
  return out;
}

  });
  var condByBlock = {};

  condByBlock['B3 · TRADE-OFFS'] = A.block_order === 'tradeoffs_first' ? '1r de los dos bloques rotados' : '2º de los dos bloques rotados';
  condByBlock['B4 · CONSPIRACY BELIEFS'] = A.block_order === 'conspiracy_first' ? '1r de los dos bloques rotados' : '2º de los dos bloques rotados';
  condByBlock['B7 · EXPERIMENTO 1'] = A.spain_split_exp1 === 'list'
    ? 'Rama ' + A.rama + ' · list_arm ' + A.list_arm : 'items_spain';

  condByBlock['B10 · EXPERIMENTO 3'] = A.exp3_block === 'debunk'
    ? 'DEBUNK · ' + DEBUNK[A.condition_debunk].name

  blocks.forEach(function(b, i){

    var a = el('a','jump', b.name);

    node.appendChild(a);
    if(condByBlock[b.name]) node.appendChild(el('span','cond','· ' + condByBlock[b.name]));
    node.appendChild(el('span','n', b.n + (b.n === 1 ? ' pantalla' : ' pantallas')));

  h.appendChild(el('p','hint','Haz clic en un bloque para ir directamente a su primera pantalla. Los saltos quedan registrados en la hoja de respuestas.'));

  var start = el('button','nav','Empezar la encuesta →');
  start.type = 'button';
  start.onclick = function(){ if(!S.startTs) S.startTs = Date.now(); goTo(0, false); };
  var re = el('button','nav ghost','↻ Reasignar condiciones');
  re.type = 'button';
  re.onclick = function(){
    if(!confirm('Se volverán a asignar todas las condiciones al azar y se borrarán las respuestas y los comentarios de esta sesión. ¿Continuar?')) return;
    S.answers = {}; S.comments = {}; S.timings = []; S.derived = {};
    S.terminated = null; S.startTs = null; S.qStartTs = null; S.sent = false;
    S.panel.reshuffles++;
    assignAll();
    FLOW = buildFlow();
    idx = null;

  row.appendChild(start);

  }

  app.appendChild(h);
}

   7. PANTALLA FINAL, EXPORTACIÓN Y ENVÍO

function flatValue(q){
  var v = S.answers[q.code];
  if(v === undefined) v = null;
  return v;
}

function buildFlat(){
  var flat = {};
  FLOW.forEach(function(q){
    var v = S.answers[q.code];
    if(q.items){
      q.items.forEach(function(it){
        flat[it.key] = (v && v[it.key] != null && v[it.key] !== '') ? v[it.key] : '';
      });
    } else if(q.type === 'birthdate'){
      var b = v || {};
      var age = ageFrom(b.year, b.month);
      flat.birth_year = b.year == null ? '' : b.year;
      flat.birth_month = b.month == null ? '' : b.month;
      flat.RESP_AGE = age == null ? '' : age;
      flat.QUOTAGERANGE = age == null ? '' : quotAgeRange(age);
    } else if(q.type === 'residence'){
      var r = v || {};
      flat.ESProvincia = r.provincia || '';
      flat.ESMunicipality = r.municipio || '';
      flat.ESTownName = r.localidad || '';
      flat.ESZipcode = r.cp || '';
      flat.ESREGION2 = r.region == null ? '' : r.region;
      flat.ESREGION2_nombre = r.region == null ? '' : (REGION_NAMES[r.region] || '');
    } else {
      flat[q.varKey] = (v == null) ? '' : v;
    }
    flat[q.varKey + '_comment'] = S.comments[q.code] || '';
  });
  /* recodificaciones derivadas */
  var edu = S.answers.ES01EDU;
  flat.EducationGRP = edu == null ? '' : (edu <= 2 ? 1 : (edu <= 5 ? 2 : 3));
  flat.S0 = 6;
  flat.grupo_menos_preferido = S.derived.gmp || '';
  /* órdenes de presentación */
  FLOW.forEach(function(q){
    if(q.randomized && S.orders[q.code]) flat[q.varKey + '_order'] = S.orders[q.code].join(',');
    if(q.listOrder) flat[q.varKey + '_order'] = q.listOrder.join(' | ');
  });
  TRADEOFFS.forEach(function(t){ flat['flip_' + t.code] = S.flips[t.code] ? 1 : 0; });
  return flat;
}

function totalSeconds(){
  return Math.round(S.timings.filter(Boolean).reduce(function(a,b){ return a + b.seconds; }, 0));
}

function assignPayload(){
  var A = S.assign;
  var modo = (S.panel.jumps || S.panel.reshuffles || S.panel.reopened) ? 1 : 0;
  return {
    modo_revision: modo,
    n_saltos: S.panel.jumps,
    n_reasignaciones: S.panel.reshuffles,
    block_order: A.block_order,
    spain_split_exp1: A.spain_split_exp1,
    rama: A.spain_split_exp1 === 'list' ? A.rama : '',
    list_arm: A.spain_split_exp1 === 'list' ? A.list_arm : '',
    condition_traits: TRAITS[A.condition_traits].name,
    exp3_block: A.exp3_block,
    condition_debunk: A.exp3_block === 'debunk' ? DEBUNK[A.condition_debunk].name : '',
    condition_prebunk: A.exp3_block === 'prebunk' ? PREBUNK[A.condition_prebunk].name : '',
    terminado_en: S.terminated || ''
  };
}

function renderEnd(){
  window.scrollTo(0,0);
  app.innerHTML = '';
  var c = el('div','card');

  if(S.terminated === 'consent'){
    c.appendChild(el('h1', null, 'La encuesta ha finalizado'));
    c.appendChild(el('div','warnbox','<p>Has indicado que <b>no</b> deseas participar, de modo que la encuesta termina aquí. Gracias de todos modos por tu tiempo.</p><p>Si te has equivocado, puedes volver atrás y cambiar la respuesta.</p>'));
  } else if(S.terminated === 'age'){
    c.appendChild(el('h1', null, 'La encuesta ha finalizado'));
    c.appendChild(el('div','warnbox','<p>Esta encuesta está dirigida a personas de <b>18 años o más</b>. Gracias por tu interés.</p><p>Si te has equivocado con la fecha de nacimiento, puedes volver atrás y corregirla.</p>'));
  } else {
    c.appendChild(el('h1', null, 'Fin del recorrido'));
    c.appendChild(el('div','ok','<p>Has completado el simulador. Gracias por dedicarle el tiempo.</p>'));
  }

  var secs = totalSeconds();
  var mins = Math.floor(secs/60), rest = secs % 60;
  c.appendChild(el('p', null, '<b>Tiempo total registrado:</b> ' + mins + ' min ' + rest + ' s · ' +
    S.timings.filter(Boolean).length + ' pantallas cronometradas de ' + FLOW.length + '.'));

  var mod = assignPayload();
  if(mod.modo_revision){
    c.appendChild(el('div','warnbox','<p>Esta sesión ha usado el panel de revisión (' +
      mod.n_saltos + ' salto(s), ' + mod.n_reasignaciones + ' reasignación(es)). ' +
      'Los tiempos <b>no</b> son comparables con una pasada limpia; la fila quedará marcada con <code>modo_revision = 1</code>.</p>'));
  }

  /* repaso de comentarios */
  c.appendChild(el('h2', null, 'Tus comentarios'));
  var any = false;
  var rl = el('div','reviewlist');
  FLOW.forEach(function(q){
    var t = (S.comments[q.code]||'').trim();
    if(!t) return;
    any = true;
    var r = el('div','r');
    r.appendChild(el('div','k', q.block + ' · ' + q.varKey + '_comment'));
    r.appendChild(el('div', null, t.replace(/&/g,'&amp;').replace(/</g,'&lt;')));
    rl.appendChild(r);
  });
  if(!any) rl.appendChild(el('p','hint','No has escrito ningún comentario.'));
  c.appendChild(rl);

  /* condiciones (ya se pueden mostrar: el debriefing revela el diseño) */
  c.appendChild(el('h2', null, 'Condiciones de esta sesión'));
  var ul = el('ul');
  condLabel().forEach(function(p){ ul.appendChild(el('li', null, '<b>' + p[0] + ':</b> ' + p[1])); });
  c.appendChild(ul);

  /* envío */
  var row = el('div','btn-row');
  var back = el('button','nav ghost','← Atrás');
  back.type = 'button'; back.onclick = goBack;
  row.appendChild(back);
  var send = el('button','nav','Enviar respuestas');
  send.type = 'button';
  var status = el('div','qnote');
  send.onclick = function(){
    if(!APPS_SCRIPT_URL){
      status.innerHTML = '<b>No hay ninguna URL de recogida configurada.</b> Las respuestas no se han enviado. Rellena <code>APPS_SCRIPT_URL</code> en el HTML.';
      return;
    }
    send.disabled = true;
    status.textContent = 'Enviando...';
    var payload = {
      flat: buildFlat(),
      assign: assignPayload(),
      timestampClient: new Date().toISOString(),
      totalSeconds: totalSeconds()
    };
    fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
      .then(function(){
        S.sent = true;
        status.innerHTML = 'Enviado. El navegador <b>no puede confirmar</b> la respuesta del servidor (envío sin CORS): comprueba la hoja de cálculo para verificar que la fila ha llegado.';
      })
      .catch(function(e){
        send.disabled = false;
        status.textContent = 'Error al enviar: ' + e;
      });
  };
  row.appendChild(send);
  c.appendChild(row);
  c.appendChild(status);

  var home = el('div','footlink','<a href="#">Volver al panel del simulador</a>');
  home.querySelector('a').onclick = function(e){ e.preventDefault(); idx = null; S.panel.reopened++; renderCurrent(); };
  c.appendChild(home);

  app.appendChild(c);
  setProgress();
}

/* ==========================================================================
   8. ARRANQUE
   ========================================================================== */
function boot(){
  assignAll();
  FLOW = buildFlow();
  idx = null;
  renderHome();
}
if(typeof document !== 'undefined' && document.getElementById('app')) boot();
</script>
</body>
</html>
